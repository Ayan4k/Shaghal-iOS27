name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Native Liquid Glass build: require the iOS 26 SDK
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate iOS project and add packages
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: Build (no codesign)
        working-directory: app
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign -v 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # لو البناء فشل: اطبع الأخطاء الحقيقية (Dart / Swift / ObjC / Pods)
      - name: Show build errors
        if: failure()
        run: |
          echo "===== error lines ====="
          grep -nE "error:|Error:|\\*\\* BUILD FAILED|requires a development team|Undefined symbols|ld: " build.log | head -80 || true
          echo "===== last 120 lines ====="
          tail -n 120 build.log

      # تشخيص: هل الزجاج النيتيف (UIGlassEffect) اتبنى فعلاً جوّه التطبيق؟
      - name: Diagnose Liquid Glass support
        working-directory: app
        run: |
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK: ${SDK_VERSION}"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "ERROR: iOS 26 SDK is required; found ${SDK_VERSION}"
            exit 1
          fi
          found=0
          # البلجن بتتلحم static جوّه باينري التطبيق نفسه، فالفحص لازم يشمل Runner مش الفريموركس بس
          bins="build/ios/iphoneos/Runner.app/Runner"
          for f in build/ios/iphoneos/Runner.app/Frameworks/*.framework; do
            [ -e "$f" ] && bins="$bins $f/$(basename "$f" .framework)"
          done
          for b in $bins; do
            # ممنوع grep -q هنا: بيخرج بدري فيضرب strings بـ SIGPIPE ومع pipefail بيطلع 141 = NOT FOUND غلط
            if [ -f "$b" ] && strings -a "$b" 2>/dev/null | grep UIGlassEffect >/dev/null 2>&1; then
              echo "UIGlassEffect FOUND in $b"; found=1
            fi
          done
          if [ "$found" = "0" ]; then echo "UIGlassEffect NOT FOUND (checked app binary and frameworks)"; fi

      - name: Package IPA
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Shaghal.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Shaghal-ipa
          path: app/Shaghal.ipa
